name: Build 1Panel image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: 1panel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Read and verify application version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "deploy/1panel/apps/xui-deploy-assistant/${version}/data.yml"
          test -f "deploy/1panel/apps/xui-deploy-assistant/${version}/docker-compose.yml"
          grep -Fq "ghcr.io/wstimin/sy-xuizs:${version}" \
            "deploy/1panel/apps/xui-deploy-assistant/${version}/docker-compose.yml"
          grep -Fq "APP_VERSION=${version}" docker/1panel/Dockerfile
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wstimin/sy-xuizs
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=X-UI Deploy Assistant
            org.opencontainers.image.description=Independent 1Panel image for X-UI Deploy Assistant
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/1panel/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=1panel-image
          cache-to: type=gha,mode=max,scope=1panel-image
          provenance: true
          sbom: true

      - name: Create permanent 1Panel packages
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release/1panel
          cd deploy/1panel/apps
          zip -r "$GITHUB_WORKSPACE/release/1panel/xui-deploy-assistant-1panel-${version}.zip" \
            xui-deploy-assistant
          cd "$GITHUB_WORKSPACE/release/1panel"
          cp "xui-deploy-assistant-1panel-${version}.zip" \
            xui-deploy-assistant-1panel.zip
          sha256sum xui-deploy-assistant-1panel*.zip > SHA256SUMS

      - name: Upload 1Panel application package
        uses: actions/upload-artifact@v4
        with:
          name: xui-deploy-assistant-1panel-${{ steps.version.outputs.version }}
          path: |
            release/1panel/xui-deploy-assistant-1panel*.zip
            release/1panel/SHA256SUMS
          retention-days: 30

      - name: Publish permanent 1Panel release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1panel-latest
          name: Latest 1Panel deployment package
          target_commitish: ${{ github.sha }}
          body: |
            Permanent 1Panel deployment package for X-UI Deploy Assistant.

            Download `xui-deploy-assistant-1panel.zip`, import it through the
            1Panel web interface, choose the web port, and complete the existing
            administrator initialization page after the container starts.

            Container image: `ghcr.io/wstimin/sy-xuizs:${{ steps.version.outputs.version }}`
          generate_release_notes: false
          make_latest: false
          prerelease: false
          overwrite_files: true
          files: |
            release/1panel/xui-deploy-assistant-1panel*.zip
            release/1panel/SHA256SUMS
