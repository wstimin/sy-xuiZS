name: Build release package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run lint

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Build production application
        run: npm run build

      - name: Prepare release package
        run: npm run package:release

      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify release package
        shell: bash
        run: |
          test -s release/package/VERSION
          test -s release/package/dist/server.cjs
          test -s release/package/dist/admin-cli.cjs
          test -s release/package/dist/index.html
          test -s release/package/install.sh
          test -s release/package/package-lock.json
          test ! -e release/package/server.ts
          test ! -e release/package/src

      - name: Smoke test production package
        shell: bash
        run: |
          cd release/package
          npm ci --omit=dev
          export PORT=1891
          export DATABASE_PATH="$RUNNER_TEMP/xui-commercial-release.db"
          export APP_VERSION="$(cat VERSION)"
          node dist/server.cjs > "$RUNNER_TEMP/xui-commercial-release.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 1
          done
          grep -Fq "\"version\":\"${APP_VERSION}\"" "$RUNNER_TEMP/health.json"
          curl -fsS "http://127.0.0.1:${PORT}/api/auth/bootstrap-status" \
            | grep -Fq '"required":true'
          node dist/admin-cli.cjs info | grep -Fq "$DATABASE_PATH"
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          rm -rf node_modules

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag v$tag_version does not match package version $package_version"
            exit 1
          }

      - name: Create archives and checksums
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tar -C release/package -czf "release/xui-zhushou-linux-v${version}.tar.gz" .
          cp "release/xui-zhushou-linux-v${version}.tar.gz" release/xui-zhushou-linux.tar.gz
          cd release
          sha256sum xui-zhushou-linux*.tar.gz > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xui-zhushou-linux-${{ github.sha }}
          path: |
            release/xui-zhushou-linux*.tar.gz
            release/SHA256SUMS
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            release/xui-zhushou-linux*.tar.gz
            release/SHA256SUMS
